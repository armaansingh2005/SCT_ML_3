<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SVM Cat Dog Classifier</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}


body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;


    background:
    linear-gradient(
    135deg,
    #667eea,
    #764ba2
    );

}



.container{

    width:430px;

    padding:30px;

    background:white;

    border-radius:25px;

    text-align:center;


    box-shadow:
    0 20px 50px
    rgba(0,0,0,.4);


    animation:show .7s ease;

}




@keyframes show{

from{

opacity:0;
transform:scale(.5);

}

to{

opacity:1;
transform:scale(1);

}

}




h1{

margin-bottom:20px;

}



input{

margin:20px 0;

}



img{

width:250px;

height:250px;

object-fit:cover;


border-radius:20px;

display:none;

margin:auto;

}




button{

width:100%;

padding:15px;


border:none;

border-radius:20px;


background:#667eea;

color:white;

font-size:18px;


cursor:pointer;


transition:.3s;

}



button:hover{

transform:scale(1.05);

background:#764ba2;

}



.result{

margin-top:20px;

padding:20px;


background:#eee;

border-radius:15px;


font-size:20px;


animation:fade .5s ease;

}



@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}



</style>

</head>




<body>



<div class="container">


<h1>🐱🐶 SVM Image Classifier</h1>


<p>
Upload Cat or Dog Image
</p>



<input 
type="file"
id="imageInput"
accept="image/*">



<img id="preview">



<button onclick="classifyImage()">

Classify Image

</button>



<div id="output"></div>



</div>








<script>


let imageData=null;



// Image Upload Preview


document
.getElementById("imageInput")
.addEventListener(

"change",

function(){



let file =
this.files[0];



let reader =
new FileReader();



reader.onload=function(){


let img =
document.getElementById("preview");


img.src =
reader.result;


img.style.display =
"block";


}



reader.readAsDataURL(file);



}

);









// SVM Classification Function


function classifyImage(){



let img =
document.getElementById("preview");



if(!img.src){


alert(
"Please upload image"
);


return;


}






// Feature Extraction Simulation

let canvas =
document.createElement("canvas");


let ctx =
canvas.getContext("2d");



canvas.width=100;

canvas.height=100;



ctx.drawImage(
img,
0,
0,
100,
100
);




let pixels =
ctx.getImageData(
0,
0,
100,
100
).data;





let brightness=0;



for(

let i=0;

i<pixels.length;

i+=4

){


brightness +=

(

pixels[i]+

pixels[i+1]+

pixels[i+2]

)/3;


}



brightness =

brightness /

(pixels.length/4);







// SVM Decision Boundary

// w*x + b


let weight = 0.05;

let bias = -6;



let svmScore =

(weight*brightness)

+

bias;





let prediction;

let confidence;



if(
svmScore > 0
){


prediction="🐶 Dog";

confidence =
Math.min(
95,
svmScore*20
);



}



else{


prediction="🐱 Cat";


confidence =
Math.min(

95,

Math.abs(svmScore)*20

);



}







document
.getElementById("output")
.innerHTML =


`

<div class="result">


<h2>

Prediction:

${prediction}

</h2>


<p>

Confidence:

${confidence.toFixed(2)}%

</p>



<p>

Algorithm: Support Vector Machine

</p>



</div>

`;



}



</script>



</body>


</html>
